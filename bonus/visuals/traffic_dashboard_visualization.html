<!DOCTYPE html>
<html lang=""el">

<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title> Traffic Streaming Dashboard Monitor</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>
<div class="page">
    <!-- ----------------------------------------------------- -->
    <!-- ----------------------HEADER------------------------- -->
    <!-- ----------------------------------------------------- -->
    <header>
        <div class="header-left">
            <h1><b> ⚡ TRAFFIC STREAMING DASHBOARD MONITOR</b></h1>
            <p> UXSIM ➡ Redpanda ➡ Spark ➡ MongoDB - REST API Explorer </p>
        </div>

        <div class="header-right">
            
            <div class="api-config">
                <span>REST API:</span>

                <input type="text", id="apiBase", value="http://localhost:5000"/>
            </div>

            <div class="status-pill" id="healthPill">
                <div class="status-dot" id="statusDot"></div>
                <span id="statusText"> 💤OFFLINE </span>
            </div>

        </div>
    </header>

    <nav>
        <button class="active" data-panel="stats">📊 Latest Stats data</button>
        <button data-panel="windowed">⚙ Windowed</button>
        <button data-panel="raw">📦 Raw Data</button>
        <button data-panel="summary">📈 Summary</button>
        <button data-panel="health">💚 Health</button>
    </nav>

    <!-- ----------------------------------------------------- -->
    <!-- ---------------------STAS DATA----------------------- -->
    <!-- ----------------------------------------------------- -->
    <div class="panel active" id="panel-stats">
        <div class="kpi-grid">

            <div class="kpi">
                <div class="kpi-label"> Active Links</div>
                <div class="kpi-value" id="kpi-links"> - </div>
            </div>

            <div class="kpi">
                <div class="kpi-label"> Average Speed</div>
                <div class="kpi-value" id="kpi-speed"> - </div>
            </div>

            <div class="kpi">
                <div class="kpi-label"> Vehicles</div>
                <div class="kpi-value" id="kpi-vehicles"> - </div>  <!-- ← άλλαξε από kpi-links -->
            </div>

        </div>

        <div class="table-wrap">

            <div class="table-header">
                <span> Latest Statistics </span>
                <div class="table-actions">
                    <button id="statsRefreshButton"> 🔄 Refresh</button>
                </div>
            </div>
            
            <div id="statsTableArea"></div>

        </div>

    </div>

    <!-- ----------------------------------------------------- -->
    <!-- -------------------WINDOWED DATA--------------------- -->
    <!-- ----------------------------------------------------- -->   
    <div class="panel" id="panel-windowed">

        <div class="table-wrap">

            <div class="table-header">
                <span> Windowed Statistics </span>
                <div class="table-actions">
                    <input type="text" id="windowedLink" placeholder="link..."/>
                    <button id="windowedRefreshButton"> 🔄 Refresh</button>
                </div>
            </div>
            
        <div id="windowedTableArea"></div>

        </div>
    </div> 

    <!-- ----------------------------------------------------- -->
    <!-- ----------------------RAW DATA----------------------- -->
    <!-- ----------------------------------------------------- -->   
    <div class="panel" id="panel-raw">

        <div class="table-wrap">

            <div class="raw-controls">
                <input type="number" id="rawLimit" value="50"/>
                <input type="number" id="rawSkip" value="0"/>
                <input type="text" id="rawLink" placeholder="link..."/>
                <button id="rawRefreshButton"> 🔄 Refresh</button>
            </div>

            <div id="rawTableArea"></div>

        </div>
    </div>

    <!-- ----------------------------------------------------- -->
    <!-- ----------------------SUMMARY------------------------ -->
    <!-- ----------------------------------------------------- -->    
    <div class="panel" id="panel-summary">

        <div class="table-header">
            <span> Summary </span>
            <button id="summaryRefreshButton"> 🔄 Refresh</button>
        </div>

        <div class="summary-grid" id="summaryGrid"></div>
    </div> 

    <!-- ----------------------------------------------------- -->
    <!-- ----------------------HEALTH------------------------- -->
    <!-- ----------------------------------------------------- -->   
    <div class="panel" id="panel-health">

        <div class="table-header">
            <span> Health </span>
            <button id="healthRefreshButton"> 🔄 Refresh</button>
        </div>

        <div id="healthGrid"></div>

        <div class="log-terminal" id="logTerminal"></div>
    </div> 

</div>

<script type="module" src="./js/app.js"></script>

</body>
</html>
